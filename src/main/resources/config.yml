#MCA 文件目录
MCA_DIR: "/opt/MinecraftServer-AHA/survival/world/region"

# 风化时间,单位天，默认730天（2年）
# 提示：时间越长，查询越快（因为过滤的数据越少）
WEATHERING_TIME: 730

#在同一个区域MCA文件中查询方块事件阈值,以下俩个次数任意一个达到就判断为有玩家活跃区域。
#查询方块事件阈值
THRESHOLD: 128

#查询互动事件阈值
INTERACTION_THRESHOLD: 64

#查询半径（格），默认128。【性能关键参数！】
#一个MCA区域是512x512格，半径影响查询性能：
#  - 256格：查询整个区域（最准确，但最慢）
#  - 128格：查询中心256x256区域（推荐，速度快4倍）
#  - 64格：查询中心128x128区域（最快，速度快16倍，但可能漏掉边缘）
QUERY_RADIUS: 128

#查询时允许的最大线程
#提示：不是越多越好！数据库查询是IO密集型，4-8线程即可
THREAD_MAX: 4

#MCA文件最小大小过滤（KB）：小于此大小的区域文件将被跳过，默认2048KB(2MB)
#只是路过生成的区域，文件通常只有几十KB，可以直接认为是无活动区域
#设置为0表示不过滤
MIN_FILE_SIZE_KB: 2048

#缓存有效期（天）：超过此时间的缓存记录将被重新检查，默认7天
#提示：减少此值可以减少重复查询，建议5-7天
CACHE_EXPIRE_DAYS: 7

#调试模式：启用后会输出详细的查询日志，默认false
DEBUG_MODE: false

#【已废弃】是否启用数据库模式，默认false（建议保持false）
#这是 v1.1 旧版本遗留参数，新版本不再维护数据库模式，不推荐使用
#统一使用 CoreProtect API 调用即可，CoreProtect 内部无论使用数据库还是其他存储方式都不影响本插件
#false: 使用 CoreProtect API（推荐）
#true: 直接查询 CoreProtect 数据库（已废弃，不再维护）
ENABLE_DATABASE: false

#如果是数据库请填写数据库信息
DATABASE:
  host: localhost
  port: 3306
  database: coreprotect
  username: root
  password: root
